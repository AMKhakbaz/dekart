name: Build and Save Dekart Docker Image

on:
  workflow_dispatch: # Allows you to run the workflow manually from GitHub
  # schedule:
  #   - cron: '0 0 * * 0' # Optional: Runs automatically every week

jobs:
  build-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose version

      - name: Create .env file for Docker Compose
        run: |
          cat > .env << EOF
          DOCKER_COMPOSE_IMAGE=dekartxyz/dekart:latest
          DEKART_POSTGRES_PASSWORD=dekart
          DEKART_POSTGRES_USER=dekart
          DEKART_POSTGRES_DB=dekart
          DEKART_MAPBOX_TOKEN=
          DEKART_ALLOW_FILE_UPLOAD=1
          DEKART_STORAGE=GCS
          DEKART_DATASOURCE=BQ
          EOF

      - name: Build Docker image with Docker Compose
        run: |
          docker compose build dekart-oidc

      - name: Tag Docker image
        run: |
          docker tag $(docker images --format '{{.Repository}}:{{.Tag}}' | grep dekart | head -1) dekart-custom:latest

      - name: Save Docker image as tar.gz
        run: |
          docker save dekart-custom:latest | gzip > dekart-custom.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dekart-image
          path: dekart-custom.tar.gz
          retention-days: 7
